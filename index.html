<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech Crew Sign Up</title>

  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2c;
      --panel-2: #162238;
      --line: #25324a;
      --line-strong: #33415f;
      --text: #f7f9fc;
      --muted: #9aa7bd;
      --blue: #3b82f6;
      --blue-soft: rgba(59,130,246,.14);
      --green: #22c55e;
      --green-soft: rgba(34,197,94,.12);
      --amber: #f59e0b;
      --amber-soft: rgba(245,158,11,.12);
      --red: #ef4444;
      --red-soft: rgba(239,68,68,.12);
      --radius: 18px;
      --shadow: 0 18px 55px rgba(0,0,0,.28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      overscroll-behavior: none;
    }

    body {
      background-color: var(--bg);
      overscroll-behavior: none;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      overscroll-behavior: none;
    }

    .app-shell {
      min-height: 100vh;
      background: var(--bg);
    }

    body {
      background:
        radial-gradient(circle at 8% -8%, rgba(59,130,246,.12), transparent 360px),
        var(--bg);
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none !important;
    }

    .topbar {
      height: 72px;
      border-bottom: 1px solid var(--line);
      background: rgba(11,18,32,.92);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-inner {
      max-width: 1320px;
      margin: 0 auto;
      height: 100%;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 250px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      display: grid;
      place-items: center;
      color: white;
      box-shadow: 0 10px 26px rgba(59,130,246,.25);
      flex: 0 0 auto;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      display: block;
    }

    .brand h1 {
      font-size: 20px;
      line-height: 1.05;
      margin: 0;
      letter-spacing: -.02em;
    }

    .brand small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
      font-size: 12px;
    }

    .nav {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav-btn, .btn, .seg-btn {
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 10px 13px;
      font-weight: 800;
      transition: .14s ease;
    }

    .nav-btn:hover, .btn:hover, .seg-btn:hover {
      border-color: var(--line-strong);
      transform: translateY(-1px);
    }

    .nav-btn.active, .btn.primary, .seg-btn.active {
      background: var(--blue);
      border-color: rgba(255,255,255,.12);
      color: white;
    }

    .btn.small {
      padding: 7px 10px;
      font-size: 13px;
      border-radius: 10px;
    }

    .btn.ghost {
      background: transparent;
    }

    .btn.danger {
      background: var(--red);
    }

    .btn.unavailable {
      background: rgba(148, 163, 184, .12);
      border-color: rgba(148, 163, 184, .18);
      color: #94a3b8;
    }

    .main {
      max-width: 1320px;
      margin: 0 auto;
      padding: 22px;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .page-title h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.035em;
    }

    .page-title p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.005)), var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel.pad {
      padding: 16px;
    }

    .compact-grid {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 16px;
      align-items: start;
    }

    .side-stack {
      display: grid;
      gap: 12px;
    }

    .collapsible-panel {
      padding: 0;
      overflow: hidden;
    }

    .collapsible-head {
      width: 100%;
      min-height: 50px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .collapsible-title {
      margin: 0;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .02em;
      color: var(--muted);
      text-transform: uppercase;
      line-height: 1;
    }

    .collapsible-arrow {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 28px;
      background: rgba(59, 130, 246, .12);
      border: 1px solid rgba(96, 165, 250, .35);
      color: #bfdbfe;
      line-height: 1;
      position: relative;
      transition: .14s ease;
    }

    .collapsible-arrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg) translate(-1px, -1px);
      transform-origin: center;
    }

    .collapsible-head:hover .collapsible-arrow {
      border-color: rgba(96, 165, 250, .62);
      background: rgba(59, 130, 246, .2);
      color: white;
    }

    .collapsible-panel.open .collapsible-arrow::before {
      transform: rotate(225deg) translate(-1px, -1px);
    }

    .collapsible-body {
      padding: 0 16px 16px;
    }

    .collapsible-panel:not(.open) .collapsible-body,
    .collapsible-panel[data-open="false"] .collapsible-body,
    .collapsible-body[hidden] {
      display: none !important;
    }

    .mini-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .02em;
      color: var(--muted);
      text-transform: uppercase;
      margin: 0 0 10px;
    }

    .signup-mini {
      display: grid;
      gap: 9px;
    }

    .signup-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px;
      background: rgba(255,255,255,.025);
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .signup-row strong {
      font-size: 14px;
    }

    .signup-row span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .signup-row > .pill {
      margin-top: 0;
      align-self: center;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .seg-btn {
      min-height: 38px;
      padding: 8px 13px;
      color: var(--muted);
      font-size: 13px;
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .toolbar .btn.small {
      min-height: 38px;
      padding: 8px 13px;
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .event-control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .event-control-row .filters {
      margin-bottom: 0;
    }

    @media (max-width: 640px) {
      .event-control-row {
        flex-direction: column;
        align-items: stretch;
      }

      .event-control-row .toolbar {
        justify-content: stretch;
      }

      .event-control-row .toolbar .btn {
        flex: 1;
      }
    }

    .events-list {
      display: grid;
      gap: 10px;
    }

    .event-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      cursor: pointer;
      transition: .14s ease;
    }

    .event-info-side {
      min-width: 0;
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }

    .event-row:hover {
      transform: translateY(-1px);
      border-color: var(--blue);
      background: #142039;
    }

    .layout-preview {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #0e1728;
      overflow: hidden;
    }

    .layout-preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    .layout-preview-head strong {
      font-size: 14px;
    }

    .layout-preview img {
      display: block;
      width: 100%;
      max-height: 620px;
      object-fit: contain;
      background: white;
    }

    .layout-preview-fallback {
      padding: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .date-tile {
      width: 66px;
      height: 66px;
      border-radius: 16px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      text-align: center;
      line-height: 1;
    }

    .date-tile .mon {
      color: var(--blue);
      font-weight: 900;
      font-size: 12px;
      text-transform: uppercase;
    }

    .date-tile .day {
      font-weight: 950;
      font-size: 24px;
      margin-top: 4px;
    }

    .event-main {
      min-width: 0;
    }

    .event-main h3 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -.02em;
    }

    .event-meta {
      margin-top: 6px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
    }

    .event-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .layout-pill-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(59, 130, 246, .22);
      border: 1px solid rgba(96, 165, 250, .5);
      color: #dbeafe;
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 0 20px rgba(59, 130, 246, .12);
      transition: .14s ease;
    }

    .layout-pill-button:hover {
      background: rgba(59, 130, 246, .34);
      border-color: rgba(147, 197, 253, .75);
      transform: translateY(-1px);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .event-actions .pill,
    .event-actions .btn.small {
      min-height: 34px;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .event-actions .needed-pill {
      gap: 7px;
      padding-right: 8px;
    }

    .event-actions .needed-help {
      width: 20px;
      height: 20px;
      font-size: 11px;
      flex: 0 0 auto;
    }

    .event-actions .btn.small {
      min-width: 66px;
    }

    .needed-pill {
      gap: 8px;
      position: relative;
      overflow: visible;
    }

    .needed-help {
      display: inline-grid;
      place-items: center;
      width: 19px;
      height: 19px;
      border-radius: 999px;
      border: 1px solid rgba(245,158,11,.55);
      background: rgba(245,158,11,.12);
      color: #fde68a;
      font-size: 11px;
      font-weight: 950;
      line-height: 1;
      cursor: help;
      position: relative;
      flex: 0 0 auto;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    .needed-help:hover,
    .needed-help:focus-visible {
      background: rgba(245,158,11,.22);
      border-color: rgba(245,158,11,.8);
      outline: none;
    }

    .needed-help:hover::after {
      content: attr(data-help);
      position: absolute;
      right: 50%;
      bottom: calc(100% + 12px);
      transform: translateX(50%);
      width: max-content;
      max-width: 320px;
      padding: 10px 12px;
      border-radius: 13px;
      background: rgba(18, 29, 50, .98);
      border: 1px solid rgba(245,158,11,.45);
      color: #f8fafc;
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 18px 45px rgba(0,0,0,.45);
      z-index: 100;
      white-space: pre-line;
    }

    .needed-help:hover::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 5px);
      transform: translateX(-50%);
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 7px solid rgba(245,158,11,.75);
      z-index: 101;
    }

    .pill.blue {
      color: #bfdbfe;
      background: var(--blue-soft);
      border-color: rgba(59,130,246,.26);
    }

    .pill.green {
      color: #bbf7d0;
      background: var(--green-soft);
      border-color: rgba(34,197,94,.25);
    }

    .pill.amber {
      color: #fde68a;
      background: var(--amber-soft);
      border-color: rgba(245,158,11,.25);
    }

    .pill.red {
      color: #fecaca;
      background: var(--red-soft);
      border-color: rgba(239,68,68,.25);
    }

    .event-view {
      display: none;
    }

    .event-view.active {
      display: block;
    }

    .event-summary-card {
      padding: 14px 16px;
      margin-bottom: 14px;
      margin-top: 14px
    }

    .event-summary-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .event-summary-card h2 {
      margin: 8px 0 0;
      font-size: 26px;
      letter-spacing: -.035em;
    }

    .role-sections {
      display: grid;
      gap: 12px;
    }

    .dept-section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.015);
      overflow: hidden;
    }

    .dept-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.025);
    }

    .dept-head h3 {
      margin: 0;
      font-size: 15px;
    }

    .roles-grid {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .role-card {
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #0e1728;
      padding: 11px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .role-info-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px;
      gap: 10px;
      align-items: start;
    }

    .role-info-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .role-info-main h4 {
      margin: 0 0 5px;
      line-height: 1.08;
    }

    .role-chip-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 5px;
      margin-top: 0;
      max-width: 100%;
    }

    .person-line {
      display: flex;
      flex-wrap: wrap;
      gap: 0 6px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow: visible;
      max-height: none;
      min-height: 0;
    }

    .person-name-text {
      display: inline-flex;
      color: #dbeafe;
      font-weight: 900;
      white-space: nowrap;
    }

    .person-empty {
      color: var(--muted);
      white-space: nowrap;
    }

    .role-chip {
      display: inline-flex;
      align-items: center;
      min-height: 21px;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
    }

    .role-chip.required {
      color: #bfdbfe;
      background: rgba(59, 130, 246, .16);
      border-color: rgba(59, 130, 246, .36);
    }

    .role-chip.optional {
      color: #cbd5e1;
      background: rgba(148, 163, 184, .12);
      border-color: rgba(148, 163, 184, .22);
    }

    .role-chip.training {
      color: #fde68a;
      background: rgba(245, 158, 11, .12);
      border-color: rgba(245, 158, 11, .34);
    }

    .role-chip.no-training {
      color: #bbf7d0;
      background: rgba(34, 197, 94, .12);
      border-color: rgba(34, 197, 94, .32);
    }

    .role-chip.min {
      color: #fde68a;
      background: rgba(245, 158, 11, .12);
      border-color: rgba(245, 158, 11, .34);
    }

    .role-chip.max {
      color: #fecaca;
      background: rgba(239, 68, 68, .12);
      border-color: rgba(239, 68, 68, .34);
    }

    .role-status-stack {
      display: grid;
      gap: 6px;
      justify-items: center;
      width: 64px;
    }

    .role-count-badge {
      width: 64px;
      height: 38px;
      padding: 5px 8px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 950;
      white-space: nowrap;
    }

    .role-count-badge.good {
      color: #bbf7d0;
      background: rgba(34, 197, 94, .12);
      border: 1px solid rgba(34, 197, 94, .38);
    }

    .role-count-badge.warn {
      color: #fde68a;
      background: rgba(245, 158, 11, .12);
      border: 1px solid rgba(245, 158, 11, .38);
    }

    .role-limit-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      min-height: 23px;
      padding: 3px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 950;
      line-height: 1;
      white-space: nowrap;
    }

    .role-limit-chip.min {
      color: #fde68a;
      background: rgba(245, 158, 11, .12);
      border: 1px solid rgba(245, 158, 11, .34);
    }

    .role-limit-chip.max {
      color: #fecaca;
      background: rgba(239, 68, 68, .12);
      border: 1px solid rgba(239, 68, 68, .34);
    }

    .role-card.signed {
      border-color: rgba(34,197,94,.55);
      box-shadow: 0 0 0 1px rgba(34,197,94,.12) inset;
    }

    .role-card.locked {
      opacity: .72;
    }

    .role-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .role-card h4 {
      font-size: 15px;
      letter-spacing: -.01em;
    }

    .role-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .locked-note {
      margin-top: 7px;
      color: #fde68a;
      background: rgba(245,158,11,.08);
      border: 1px solid rgba(245,158,11,.22);
      border-radius: 10px;
      padding: 7px;
      font-size: 12px;
      line-height: 1.35;
    }

    .role-actions {
      display: flex;
      gap: 7px;
    }

    .role-actions .btn {
      flex: 1;
      padding: 7px 8px;
      font-size: 12px;
      border-radius: 10px;
    }

    .admin-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 16px;
      align-items: start;
    }

    .admin-menu {
      padding: 8px;
      position: sticky;
      top: 88px;
    }

    .admin-menu button {
      width: 100%;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px;
      font-weight: 850;
      text-align: left;
    }

    .admin-menu button.active {
      background: var(--panel-2);
      color: var(--text);
      border-color: var(--line);
    }

    .admin-screen {
      display: none;
      padding-bottom: 96px;
    }

    .admin-screen.active {
      display: block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 5px;
    }

    .field.span-2 {
      grid-column: span 2;
    }

    .field.span-3 {
      grid-column: span 3;
    }

    .field.span-6 {
      grid-column: span 6;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #0a1220;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 11px;
      outline: none;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
    }

    .role-builder {
      display: grid;
      gap: 10px;
    }

    .builder-section {
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,.015);
    }

    .builder-section-head {
      padding: 8px 12px;
      background: rgba(255,255,255,.025);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .builder-section-head h4 {
      margin: 0;
      font-size: 14px;
    }

    .builder-roles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
      gap: 8px;
      padding: 9px;
    }

    .builder-role {
      display: grid;
      gap: 9px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #0e1728;
    }

    .builder-role.is-selected {
      border-color: rgba(59,130,246,.55);
      background: rgba(59,130,246,.08);
    }

    .builder-role-top {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      align-items: start;
    }

    .builder-role-title {
      min-width: 0;
    }

    .builder-role strong {
      display: block;
      font-size: 13px;
      line-height: 1.2;
    }

    .builder-role small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.25;
    }

    .builder-role-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .builder-mini-field {
      display: grid;
      gap: 4px;
    }

    .builder-mini-field span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .builder-role input[type="number"] {
      padding: 7px 8px;
      border-radius: 9px;
      min-width: 0;
    }

    .builder-role input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--blue);
    }

    .builder-optional {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .list-table {
      display: grid;
      gap: 7px;
    }

    .table-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.018);
    }

    .table-row strong {
      display: block;
      font-size: 14px;
    }

    .table-row span {
      color: var(--muted);
      font-size: 12px;
    }

    .staffing-event-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.018);
      cursor: pointer;
      position: relative;
    }

    .staffing-event-card:hover {
      border-color: var(--blue);
    }

    .staffing-event-card.active {
      border-color: rgba(59,130,246,.75);
      background: rgba(59,130,246,.09);
      box-shadow: 0 0 0 1px rgba(59,130,246,.18) inset;
    }

    .staffing-role {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      background: #0e1728;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      height: 100%;
      min-height: 0;
    }

    .staffing-signups {
      display: grid;
      align-content: start;
      gap: 8px;
      min-height: 0;
    }

    .staffing-actions {
      display: grid;
      align-self: end;
    }

    .staffing-actions .btn {
      width: 100%;
      min-height: 42px;
    }

    .staffing-person {
      min-width: 0;
      min-height: 58px;
    }

    .staffing-person {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border-radius: 10px;
      background: rgba(255,255,255,.025);
      overflow: hidden;
    }

    .staffing-person > div:first-child {
      min-width: 0;
    }

    .staffing-person strong,
    .staffing-person div div {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .staffing-person .btn {
      flex-shrink: 0;
      max-width: 86px;
    }


    .event-status-actions {
      display: grid;
      gap: 10px;
      justify-items: stretch;
      min-width: 360px;
    }

    .event-status-actions .event-signed-pill {
      justify-content: center;
      min-height: 38px;
      font-size: 13px;
      font-weight: 950;
      white-space: normal;
      text-align: center;
      line-height: 1.25;
    }

    .event-availability-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .event-availability-actions .btn,
    .availability-admin-actions .btn,
    .availability-actions .btn {
      min-height: 40px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 950;
      border: 1px solid rgba(96,165,250,.42);
      background: rgba(59,130,246,.16);
      color: #dbeafe;
      box-shadow: 0 0 0 1px rgba(255,255,255,.025) inset;
      white-space: nowrap;
    }

    .event-availability-actions .btn:hover,
    .availability-admin-actions .btn:hover,
    .availability-actions .btn:hover {
      background: rgba(59,130,246,.26);
      border-color: rgba(147,197,253,.7);
      transform: translateY(-1px);
    }

    .event-availability-actions .btn.performing,
    .availability-admin-actions .btn.performing {
      border-color: rgba(59,130,246,.52);
      background: rgba(59,130,246,.18);
    }

    .event-availability-actions .btn.unavailable,
    .availability-admin-actions .btn.unavailable {
      border-color: rgba(245,158,11,.48);
      background: rgba(245,158,11,.13);
      color: #fde68a;
    }

    .event-availability-actions .btn.undo,
    .availability-actions .btn.undo {
      border-color: rgba(239,68,68,.45);
      background: rgba(239,68,68,.11);
      color: #fecaca;
    }

    .availability-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }

    .availability-list,
    .not-signed-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .availability-row,
    .not-signed-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 9px;
      align-items: stretch;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.022);
    }

    .availability-person {
      min-width: 0;
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }

    .availability-person strong {
      color: #dbeafe;
      font-weight: 900;
      font-size: 15px;
      line-height: 1.15;
    }

    .not-signed-actions,
    .availability-admin-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .availability-row .availability-actions {
      justify-content: stretch;
    }

    .availability-row .availability-actions .btn {
      width: 100%;
    }

    @media (max-width: 760px) {
      .availability-list,
      .not-signed-grid {
        grid-template-columns: 1fr;
      }
    }


    .copy-results {
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .copy-result {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #0e1728;
    }

    .empty, .notice {
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }

    .notice.error {
      border-color: rgba(239,68,68,.45);
      color: #fecaca;
      background: var(--red-soft);
    }

    .notice.success {
      border-color: rgba(34,197,94,.35);
      color: #bbf7d0;
      background: var(--green-soft);
    }

    .toast-stack {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: grid;
      gap: 12px;
      z-index: 9999;
      width: min(390px, calc(100vw - 40px));
    }

    .toast {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02)),
        rgba(18, 29, 50, .98);
      border: 1px solid rgba(96,165,250,.55);
      color: var(--text);
      border-radius: 18px;
      padding: 14px 15px 14px 17px;
      box-shadow:
        0 22px 65px rgba(0,0,0,.55),
        0 0 0 1px rgba(255,255,255,.04) inset,
        0 0 32px rgba(59,130,246,.16);
      animation: toastIn .22s cubic-bezier(.2,.9,.25,1.2);
    }

    .toast::before {
      content: "";
      position: absolute;
      left: 0;
      top: -18px;
      bottom: -18px;
      width: 5px;
      background: var(--blue);
      border-radius: 999px;
    }

    .toast.success {
      border-color: rgba(34,197,94,.65);
      box-shadow:
        0 22px 65px rgba(0,0,0,.55),
        0 0 0 1px rgba(255,255,255,.04) inset,
        0 0 36px rgba(34,197,94,.2);
    }

    .toast.success::before {
      background: var(--green);
    }

    .toast.error {
      border-color: rgba(239,68,68,.72);
      box-shadow:
        0 22px 65px rgba(0,0,0,.55),
        0 0 0 1px rgba(255,255,255,.04) inset,
        0 0 36px rgba(239,68,68,.2);
    }

    .toast.error::before {
      background: var(--red);
    }

    .toast.warning {
      border-color: rgba(245,158,11,.72);
      box-shadow:
        0 22px 65px rgba(0,0,0,.55),
        0 0 0 1px rgba(255,255,255,.04) inset,
        0 0 36px rgba(245,158,11,.2);
    }

    .toast.warning::before {
      background: var(--amber);
    }

    .toast.info {
      border-color: rgba(96,165,250,.7);
    }

    .toast.info::before {
      background: var(--blue);
    }

    .toast-title {
      font-weight: 950;
      font-size: 15px;
      margin-bottom: 4px;
      letter-spacing: -.01em;
    }

    .toast-message {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-line;
    }

    .toast-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .toast-actions .btn {
      padding: 8px 11px;
      font-size: 12px;
      border-radius: 11px;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.94);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .sticky-action-bar {
      position: fixed;
      left: max(18px, calc((100vw - 1320px) / 2 + 242px));
      right: max(18px, calc((100vw - 1320px) / 2 + 22px));
      bottom: 22px;
      z-index: 90;
      border: 1px solid rgba(96,165,250,.55);
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(59,130,246,.18), rgba(17,26,44,.96) 38%),
        rgba(15, 23, 42, .96);
      backdrop-filter: blur(18px);
      box-shadow:
        0 24px 70px rgba(0,0,0,.55),
        0 0 0 1px rgba(255,255,255,.04) inset,
        0 0 38px rgba(59,130,246,.18);
      overflow: hidden;
    }

    .sticky-action-inner {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }

    .sticky-summary {
      min-width: 0;
    }

    .sticky-summary-title {
      font-weight: 950;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .sticky-summary-meta {
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.35;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .sticky-summary-meta strong {
      color: white;
    }

    .sticky-summary-list {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sticky-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }

    .admin-screen {
      display: none;
      padding-bottom: 150px;
    }

    @media (max-width: 1150px) {
      .compact-grid, .admin-layout {
        grid-template-columns: 1fr;
      }

      .side-stack {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .admin-menu {
        position: static;
        display: flex;
        flex-wrap: wrap;
        overflow: visible;
        gap: 6px;
      }

      .admin-menu button {
        width: auto;

        margin-bottom: 0;

      }

      .sticky-action-bar {
        left: 14px;
        right: 14px;
        bottom: 18px;
      }

      .sticky-action-inner {
        grid-template-columns: 1fr;
      }

      .sticky-actions {
        justify-content: stretch;
      }

      .sticky-actions .btn {
        flex: 1;
      }
    }

      }

      }

      .nav {
        width: 100%;

      }

      .collapsible-title {

      }

      .collapsible-arrow {

      }

      .event-control-row {

      }

      .event-control-row .filters,

      .seg-btn,

      }

      .event-main h3 {

      .event-actions .pill,

        font-size: 26px;

      }

      .layout-pill-button {
        min-height: 38px;

      }

      }

      .role-actions .btn {

      .field > div[style*="grid-template-columns:1fr auto"] {

      .table-row .btn,
      .copy-result .btn,

        width: 100%;

        justify-content: stretch !important;
      }

      .staffing-event-card .toolbar .pill {
        flex: 1;

      .toast-stack {

        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        width: auto;
      }

      }

      }

      }

      events: [],
      pastEvents: [],

      roleTemplates: [],
      admin: null
    };

    let filter = "All";

    let showPast = false;
    let editingEventId = "";
    let staffingEventId = "";
    let adminUserSearch = "";

    let dashboardPanels = {
      profile: null,
      signups: null
    };

    const TRAINING_TAGS = [
      {
        id: "lighting_operator",
        name: "Lighting Operator",
        description: "Can operate lighting desk"
      },
      {
        id: "sound_operator",
        name: "Sound Operator",
        description: "Can operate sound desk"
      },
      {
        id: "stage_manager",
        name: "Stage Manager",
        description: "Can lead stage crew and manage backstage"
      },
      {
        id: "vision_mixer",
        name: "Vision Mixer",
        description: "Can operate the vision mixing desk"
      },
      {
        id: "media_director",
        name: "Media Director",
        description: "Can direct cameras / media team"
      }
    ];

    function trainingTagName(tagId) {
      const tag = TRAINING_TAGS.find(t => String(t.id) === String(tagId));
      return tag ? tag.name : tagId;
    }

    function trainingTagDescription(tagId) {
      const tag = TRAINING_TAGS.find(t => String(t.id) === String(tagId));
      return tag ? tag.description : "";
    }


    const YEAR_GROUPS = [
      "N/A",
      "Year 7",
      "Year 8",
      "Year 9",
      "Year 10",
      "Year 11",
      "Year 12",
      "Year 13",
      "Staff",
      "Archived"
    ];

    function normaliseYearGroupDisplay(value) {
      const raw = String(value || "").trim();

      if (!raw) return "";
      if (raw.toLowerCase() === "n/a") return "N/A";
      if (raw.toLowerCase() === "na") return "N/A";

      if (raw.toLowerCase() === "teacher") return "Staff";
      if (raw.toLowerCase() === "staff") return "Staff";
      if (raw.toLowerCase() === "technician") return "Staff";
      if (raw.toLowerCase() === "tech") return "Staff";
      if (raw.toLowerCase() === "support staff") return "Staff";
      if (raw.toLowerCase() === "admin") return "Staff";

      const match = raw.match(/(\d+)/);

      if (match) {
        const year = Number(match[1]);

        if (year >= 7 && year <= 13) {
          return `Year ${year}`;
        }
      }

      return raw;
    }

    function yearGroupOptions(selectedValue, includeArchived = true) {
      const selected = normaliseYearGroupDisplay(selectedValue);
      const options = includeArchived ? YEAR_GROUPS : YEAR_GROUPS.filter(group => group !== "Archived");

      return options.map(group => `
        <option value="${escapeAttr(group)}" ${group === selected ? "selected" : ""}>
          ${escapeHtml(group)}
        </option>
      `).join("");
    }

    function serverCall(name, args = []) {
      return new Promise((resolve, reject) => {
        if (!window.google || !google.script || !google.script.run) {
          reject(new Error("This file needs to run inside Apps Script."));
          return;
        }

        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[name](...args);
      });
    }

    async function loadApp() {
      try {
        const data = await serverCall("getInitialData");

        if (!data || !data.ok) {
          throw new Error("The server returned no data.");

        if (!data.allowed) {
          renderBlocked(data.reason);
          return;
        }

        state = data;

        applyResponsiveMode();
        resetDashboardPanelDefaults();

        document.getElementById("loading").style.display = "none";
        document.getElementById("dashboardPage").style.display = "block";

        const footer = document.getElementById("appFooter");
        if (footer) footer.style.display = "block";

        document.getElementById("userEmail").textContent = state.user.email;
        document.getElementById("adminNav").style.display = state.isAdmin ? "inline-flex" : "none";
        document.body.classList.toggle("is-admin-user", !!state.isAdmin);

        render();
        queueDashboardPanelRender();
      } catch (error) {
        renderFatalError(error);
      }

      document.getElementById("loading").innerHTML = escapeHtml(reason || "Access blocked.");

      document.getElementById("dashboardPage").style.display = "none";

    function dashboardViewportWidth() {
      const candidates = [];

      if (window.visualViewport && window.visualViewport.width) {
        candidates.push(window.visualViewport.width);
      }

      if (window.innerWidth) {
        candidates.push(window.innerWidth);
      }

      if (document.documentElement && document.documentElement.clientWidth) {
        candidates.push(document.documentElement.clientWidth);
      }

      const dashboard = document.getElementById("dashboardPage");
      if (dashboard && dashboard.getBoundingClientRect().width) {
        candidates.push(dashboard.getBoundingClientRect().width);
      }

      const main = document.querySelector(".main");
      if (main && main.getBoundingClientRect().width) {
        candidates.push(main.getBoundingClientRect().width);
      }

      const valid = candidates
        .map(value => Number(value))
        .filter(value => Number.isFinite(value) && value > 0);

      return valid.length ? Math.min(...valid) : 9999;
    }

    function isMobileDeviceLike() {
      const ua = String(navigator.userAgent || "");
      const mobileUa = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      const iPadLike = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
      const coarsePointer = window.matchMedia
        ? window.matchMedia("(hover: none) and (pointer: coarse)").matches
        : false;

      const screenWidth = Math.min(
        Number(screen.width || 9999),
        Number(screen.availWidth || 9999)
      );

      return mobileUa || (iPadLike && screenWidth <= 900) || (coarsePointer && screenWidth <= 760);
    }

    function isPhoneMode() {
      return dashboardViewportWidth() <= 640 || isMobileDeviceLike();
    }

    function applyResponsiveMode() {
      const phoneMode = isPhoneMode();
      const isAdmin = !!state.isAdmin;

      document.body.classList.toggle("phone-mode", phoneMode);
      document.body.classList.toggle("is-admin", isAdmin);
      document.body.classList.toggle("not-admin", !isAdmin);
    }

    function isMobileDashboard() {
      return isPhoneMode();
    }

    function resetDashboardPanelDefaults() {
      dashboardPanels = {
        profile: null,
        signups: null
      };

      if (isMobileDashboard()) {
        dashboardPanels.profile = state.user && !state.user.profileComplete;
        dashboardPanels.signups = false;
      }
    }

    function isDashboardPanelOpen(panelName) {
      if (dashboardPanels[panelName] !== null) {
        return dashboardPanels[panelName];
      }

      if (panelName === "profile" && state.user && !state.user.profileComplete) {
        return true;
      }

      return !isMobileDashboard();
    }

    function toggleDashboardPanel(panelName) {
      dashboardPanels[panelName] = !isDashboardPanelOpen(panelName);
      renderDashboardPanels();
    }

    function renderDashboardPanels() {
      const panels = [
        {
          key: "profile",
          element: document.getElementById("profilePanel")
        },
        {
          key: "signups",
          element: document.getElementById("signupsPanel")
        }
      ];

      panels.forEach(item => {
        if (!item.element) return;

        const isOpen = isDashboardPanelOpen(item.key);
        const arrow = item.element.querySelector(".collapsible-arrow");
        const body = item.element.querySelector(".collapsible-body");
        const button = item.element.querySelector(".collapsible-head");

        item.element.classList.toggle("open", isOpen);
        item.element.dataset.open = isOpen ? "true" : "false";

        if (body) {
          body.hidden = !isOpen;
          body.style.display = isOpen ? "" : "none";
          body.setAttribute("aria-hidden", String(!isOpen));
        }

        if (arrow) {
          arrow.textContent = "";
          arrow.setAttribute("aria-hidden", "true");
        }

        if (button) {
          button.setAttribute("aria-expanded", String(isOpen));
          button.setAttribute("aria-label", `${isOpen ? "Collapse" : "Expand"} ${item.key === "profile" ? "profile" : "my signups"}`);
        }
      });
    }

    function queueDashboardPanelRender() {
      applyResponsiveMode();
      renderDashboardPanels();
      requestAnimationFrame(() => {
        applyResponsiveMode();
        renderDashboardPanels();
      });
      setTimeout(() => {
        applyResponsiveMode();
        renderDashboardPanels();
      }, 80);
    }

      document.getElementById("pastToggle").textContent = showPast ? "See upcoming events" : "See past events";
      renderMySignups();
      renderEvents();
    }

    function isPastISO(dateISO) {
      if (!dateISO) return false;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const d = new Date(dateISO + "T00:00:00");

      return d < today;
    }

    async function showPage(page) {
      document.getElementById("dashboardPage").style.display = page === "dashboard" ? "block" : "none";
      document.getElementById("adminPage").style.display = page === "admin" ? "block" : "none";
      document.getElementById("eventPage").classList.remove("active");

      document.getElementById("dashNav").classList.toggle("active", page === "dashboard");
      document.getElementById("adminNav").classList.toggle("active", page === "admin");

      if (page === "admin" && state.isAdmin && !state.admin) {
        try {
          setBusy(true);
          document.getElementById("admin-create").innerHTML = `<div class="notice">Loading admin tools...</div>`;
          state.admin = await serverCall("getAdminData");
          renderAdmin();

          document.getElementById("admin-create").innerHTML = `

          `;
        } finally {
          setBusy(false);
        }
      }

    async function openEvent(eventId) {
      try {
        setBusy(true);
        renderEventLoading();

        const data = await serverCall("getEventDetails", [eventId]);
        renderEventPage(data);
      } catch (error) {

        document.getElementById("eventPage").innerHTML = `

          <div class="notice error" style="margin-top:12px;">

        setBusy(false);
      }

    function renderEventLoading() {
      document.getElementById("dashboardPage").style.display = "none";
      document.getElementById("adminPage").style.display = "none";
      document.getElementById("eventPage").classList.add("active");
      document.getElementById("dashNav").classList.remove("active");
      document.getElementById("adminNav").classList.remove("active");

      document.getElementById("eventPage").innerHTML = `

        <div class="notice" style="margin-top:12px;">
          <strong>Loading event...</strong>
        </div>
      `;
    }


    function renderDashboardUserStatusPill(e) {
      const availability = e.MyAvailability || null;
      const status = String(availability && availability.Status || "").trim().toLowerCase();

      if (status === "performing") {
        return `<span class="pill amber">You: Performing</span>`;
      }

      if (status === "unavailable") {
        return `<span class="pill red">You: Unavailable</span>`;
      }

      if (e.SignedUp) {
        return `<span class="pill blue">You: ${escapeHtml(e.MyRoles.join(", "))}</span>`;
      }

      return "";
    }

    function renderEventAvailabilityControls(e) {
      const availability = e.MyAvailability || null;

      if (availability && availability.Status) {
        return `
          <div class="event-status-actions">
            <span class="pill ${availability.Status === "Performing" ? "blue" : "amber"} event-signed-pill">
              ${availability.Status === "Performing" ? "You are attending, but performing" : "You are unavailable"}

      const statusPill = e.SignedUp

    function renderEventPage(data) {
      const e = data.event;

      const sections = data.roles.map(section => {
        const roleCount = section.roles.length;
        const hasUnlimited = section.roles.some(role => role.IsUnlimited);
        const peopleCount = section.roles.reduce((total, role) => {
          if (role.IsUnlimited) return total;
          return total + Number(role.MaxPeople || 0);
        }, 0);
        const peopleLabel = hasUnlimited
          ? peopleCount > 0
            ? `${peopleCount}+ ${peopleCount === 1 ? "person" : "people"} max`
            : "Unlimited max"
          : `${peopleCount} ${peopleCount === 1 ? "person" : "people"} max`;

        return `
          <section class="dept-section">
            <div class="dept-head">
              <h3>${escapeHtml(section.name)}</h3>

              <div class="toolbar">
                <span class="pill">${roleCount} ${roleCount === 1 ? "role" : "roles"}</span>
                <span class="pill">${escapeHtml(peopleLabel)}</span>
              </div>
            </div>

            <div class="roles-grid">
              ${section.roles.map(r => roleCard(r, data.mySignups)).join("")}
            </div>
          </section>
        `;
      }).join("");

      document.getElementById("dashboardPage").style.display = "none";
      document.getElementById("adminPage").style.display = "none";
      document.getElementById("eventPage").classList.add("active");
      document.getElementById("dashNav").classList.remove("active");
      document.getElementById("adminNav").classList.remove("active");

      document.getElementById("eventPage").innerHTML = `
        <button class="btn ghost small" onclick="showPage('dashboard')">← Back to events</button>

        <div class="panel event-summary-card">
          <div class="event-summary-top">
            <div>
              <div class="toolbar">
                <span class="pill blue">${escapeHtml(e.Tag)}</span>
                <span class="pill">${escapeHtml(e.Date)}</span>
                <span class="pill">${escapeHtml(e.StartTime)}–${escapeHtml(e.EndTime)}</span>
                ${renderLayoutPill(e.LayoutLink)}
                ${renderInputListPill(e.InputList)}
              </div>

              <h2>${escapeHtml(e.Title)}</h2>
              <p style="color:var(--muted); margin:8px 0 0;">${formatMultiline(e.Notes)}</p>
            </div>

            ${renderEventAvailabilityControls(e)}
          </div>
        </div>

        <div class="role-sections">${sections || `<div class="empty">No roles have been added to this event.</div>`}</div>
      `;
    }

    function roleCard(r, mySignups) {
      const signed = mySignups.find(s => String(s.EventRoleID) === String(r.EventRoleID));
      const full = !r.IsUnlimited && r.SpacesLeft <= 0;
      const needs = r.Filled < r.MinPeople;
      const locked = !!r.RequiresTrainingTag && !(state.user.trainingTags || []).includes(r.RequiresTrainingTag);

      const people = r.Signups.length
        ? r.Signups.map((s, index) => `
            <span class="person-name-text">
              ${escapeHtml(s.Name || s.Email)}${index < r.Signups.length - 1 ? "," : ""}
            </span>
          `).join("")
        : `<span class="person-empty">No one yet</span>`;

      return `
        <div class="role-card ${signed ? "signed" : ""} ${locked ? "locked" : ""}">
          <div>
            <div class="role-info-layout">
              <div class="role-info-main">
                <h4>${escapeHtml(r.RoleName)}</h4>

                <div class="role-chip-row">
                  <span class="role-chip ${r.IsOptional ? "optional" : "required"}">
                    ${r.IsOptional ? "Optional" : "Required"}
                  </span>

                  <span class="role-chip ${r.RequiresTrainingTag ? "training" : "no-training"}">
                    ${r.RequiresTrainingTag ? "Training" : "No training"}
                  </span>
                </div>

                <div class="person-line">${people}</div>
              </div>

              <div class="role-status-stack">
                <span class="role-count-badge ${needs ? "warn" : "good"}">
                  ${r.IsUnlimited ? r.Filled : `${r.Filled}/${r.MaxPeople}`}
                </span>

                <span class="role-limit-chip min">Min ${r.MinPeople}</span>
                <span class="role-limit-chip max">${r.IsUnlimited ? 'Max N/A' : `Max ${r.MaxPeople}`}</span>
              </div>
            </div>

            ${r.Notes ? `
              <div class="role-sub" style="margin-top:8px;">
                ${escapeHtml(r.Notes)}
              </div>
            ` : ""}

            ${locked ? `
              <div class="locked-note">
                Requires training: <strong>${escapeHtml(trainingTagName(r.RequiresTrainingTag))}</strong>. Ask a teacher if this is wrong.
              </div>
            ` : ""}
          </div>

          <div class="role-actions">
            ${signed ? `
              <button class="btn danger" onclick="cancelSignup('${escapeAttr(signed.SignupID)}')">Cancel</button>
            ` : full ? `
              <button class="btn unavailable" disabled>Full</button>
            ` : locked ? `
              <button class="btn unavailable" disabled>Unavailable</button>
            ` : `
              <button class="btn primary" onclick="signUp('${escapeAttr(r.EventID)}','${escapeAttr(r.EventRoleID)}')">Sign up</button>
            `}
          </div>
        </div>
      `;
    }


    async function setMyAvailability(eventId, status) {
      const label = status === "Performing" ? "attending, but performing" : "unavailable";

      showConfirmToast(
        status === "Performing" ? "Mark as performing?" : "Mark as unavailable?",
        "This will remove any role signups you currently have for this event.",
        async () => {
          let workingToast = null;

          try {
            setBusy(true);

            workingToast = showToast("Updating availability", `Marking you as ${label}...`, "info", 0);

            const data = await serverCall("setMyEventAvailability", [eventId, status]);

            renderEventPage(data);
            dismissToast(workingToast);

            showToast("Availability updated", `You are now marked as ${label}.`, "success", 3200);
          } catch (error) {
            dismissToast(workingToast);
            showToast("Could not update availability", error.message || error, "error", 5000);
          } finally {
            setBusy(false);
          }
        }
      );
    }

      let workingToast = null;

      try {
        setBusy(true);

        workingToast = showToast("Updating availability", "Removing your availability marker...", "info", 0);

        const data = await serverCall("clearMyEventAvailability", [eventId]);

        renderEventPage(data);
        dismissToast(workingToast);

        showToast("Availability cleared", "You can now sign up to roles again.", "success", 3000);

        dismissToast(workingToast);
        showToast("Could not clear availability", error.message || error, "error", 5000);
      } finally {
        setBusy(false);
      }
    }

    async function signUp(eventId, eventRoleId) {
      if (!state.user.profileComplete) {
        showToast("Complete your profile", "Add your name and year group before signing up.", "warning", 4000);
        return;
      }

      let workingToast = null;

      try {
        setBusy(true);

        workingToast = showToast("Signing you up", "One moment...", "info", 0);

        const data = await serverCall("signUpForRole", [eventId, eventRoleId, "Main", ""]);

        const signedRole = data.rolesFlat.find(role => String(role.EventRoleID) === String(eventRoleId));
        const roleName = signedRole ? signedRole.RoleName : "this role";

        renderEventPage(data);
        dismissToast(workingToast);

        showToast(
          "Signup successful",
          `You are now signed up for ${roleName}.`,
          "success",
          3600
        );
      } catch (error) {
        dismissToast(workingToast);
        showToast("Could not sign up", error.message || error, "error", 4500);
      } finally {
        setBusy(false);
      }
    }

            workingToast = showToast("Cancelling signup", "One moment...", "info", 0);

            renderEventPage(data);
            dismissToast(workingToast);

            showToast("Signup cancelled", "You have been removed from this role.", "success", 3000);
          } catch (error) {
            dismissToast(workingToast);
            showToast("Could not cancel signup", error.message || error, "error", 4500);
          } finally {
            setBusy(false);
          }
        }
      );
    }

    async function refreshState() {
      try {
        setBusy(true);
        const data = await serverCall("getInitialData");

        .filter(event => isPastISO(event.DateISO))
        .filter(event => !query || String(event.Title).toLowerCase().includes(query))
        .slice(0, 8);

      target.innerHTML = past.length ? past.map(event => `

    function copyRolesFromEvent(eventId) {
      const event = state.admin.events.find(e => String(e.EventID) === String(eventId));
      const existing = (state.admin.eventRoles || []).filter(er => String(er.EventID) === String(eventId));

      if (!existing.length) {
        showToast("No roles to copy", "This past event has no role setup.", "warning", 3500);
        return;
      }

      document.querySelectorAll(".role-select").forEach(cb => {
        const roleId = String(cb.dataset.roleId);
        const copiedRole = existing.find(er => String(er.RoleID) === roleId);

        cb.checked = !!copiedRole;
        cb.closest(".builder-role")?.classList.toggle("is-selected", cb.checked);

        if (copiedRole) {
          const minInput = document.querySelector(`.role-min[data-role-id="${cssEscape(roleId)}"]`);
          const maxInput = document.querySelector(`.role-max[data-role-id="${cssEscape(roleId)}"]`);
          const optionalInput = document.querySelector(`.role-optional[data-role-id="${cssEscape(roleId)}"]`);

          if (minInput) minInput.value = copiedRole.MinPeople;
          if (maxInput) maxInput.value = copiedRole.MaxPeople;
          if (optionalInput) optionalInput.checked = !!copiedRole.IsOptional;
        }
      });

      updateCreateSummary();
      showToast("Roles copied", `Copied roles from ${event ? event.Title : "past event"}.`, "success", 3000);

    function applyPresetById(templateId) {
      const templates = getRoleTemplates();
      const template = templates.find(t => String(t.TemplateID) === String(templateId));

      if (!template) {
        showToast("Template not found", "Check the RoleTemplates and TemplateRoles sheets.", "error", 4500);
        return;
      }

      if (!Array.isArray(template.Roles)) {
        showToast("Template broken", "This template has no Roles array.", "error", 4500);
        return;
      }

      document.querySelectorAll(".role-select").forEach(cb => {
        const roleId = String(cb.dataset.roleId);
        const templateRole = template.Roles.find(r => String(r.RoleID) === roleId);

        cb.checked = !!templateRole;
        cb.closest(".builder-role")?.classList.toggle("is-selected", cb.checked);

        if (templateRole) {
          const minInput = document.querySelector(`.role-min[data-role-id="${cssEscape(roleId)}"]`);
          const maxInput = document.querySelector(`.role-max[data-role-id="${cssEscape(roleId)}"]`);
          const optionalInput = document.querySelector(`.role-optional[data-role-id="${cssEscape(roleId)}"]`);

          if (minInput) minInput.value = templateRole.MinPeople;
          if (maxInput) maxInput.value = templateRole.MaxPeople;
          if (optionalInput) optionalInput.checked = !!templateRole.IsOptional;
        }
      });

      updateCreateSummary();
      showToast("Preset applied", `${template.TemplateName} roles have been selected.`, "success", 2200);
    }

    function normaliseMaxPeopleInput(value) {
      const raw = String(value || "").trim();

      if (!raw) return 1;

      const lower = raw.toLowerCase();

      if (lower === "u" || lower === "unlimited" || raw === "∞" || lower === "inf" || lower === "infinite") {
        return "U";
      }

      const number = Number(raw);

      if (!Number.isFinite(number) || number < 1) {
        return 1;
      }

      return Math.floor(number);
    }

    function collectSelectedRoles(scopeSelector = document) {
      const scope = typeof scopeSelector === "string"
        ? document.querySelector(scopeSelector)
        : scopeSelector;

      if (!scope) return [];

      return Array.from(scope.querySelectorAll(".role-select")).map(cb => {
        const roleId = cb.dataset.roleId;

        return {
          selected: cb.checked,
          roleId,
          minPeople: scope.querySelector(`.role-min[data-role-id="${cssEscape(roleId)}"]`)?.value || 0,
          maxPeople: normaliseMaxPeopleInput(scope.querySelector(`.role-max[data-role-id="${cssEscape(roleId)}"]`)?.value || 1),
          isOptional: scope.querySelector(`.role-optional[data-role-id="${cssEscape(roleId)}"]`)?.checked || false,
          notes: ""
        };
      });
    }

    function updateCreateSummary() {
      const titleBox = document.getElementById("createSummaryTitle");

      const title = val("eventTitle") || "New event";
      const tag = val("eventTag") || "Event";
      const date = val("eventDate") || "No date";

      const selectedNames = selected.map(item => {
        const role = state.roles.find(r => String(r.RoleID) === String(item.roleId));
        return role ? role.RoleName : item.roleId;
      });

      titleBox.textContent = title;
      document.getElementById("createSummaryTag").textContent = tag;
      document.getElementById("createSummaryDate").textContent = date;
      document.getElementById("createSummaryTime").textContent = start || end ? `${start || "?"}–${end || "?"}` : "No time";
      document.getElementById("createSummaryRolesCount").textContent = `${selected.length} role${selected.length === 1 ? "" : "s"} selected`;
      document.getElementById("createSummaryRolesList").textContent = selectedNames.length
        ? selectedNames.join(", ")
        : "Choose a preset, copy a past event, or select roles manually.";

    async function submitCreateEvent() {
      try {
        const selectedRoles = collectSelectedRoles("#admin-create").filter(role => role.selected);

        if (!val("eventTitle").trim()) {
          showToast("Missing title", "Add an event title before creating it.", "warning", 3500);
          return;
        }

        if (!val("eventDate")) {
          showToast("Missing date", "Choose a date before creating the event.", "warning", 3500);
          return;
        }

        if (!selectedRoles.length) {
          showToast("No roles selected", "Choose at least one role or apply a preset.", "warning", 3500);
          return;
        }

        setBusy(true);

        const payload = {
          title: val("eventTitle"),
          tag: val("eventTag"),
          date: val("eventDate"),
          startTime: val("eventStart"),
          endTime: val("eventEnd"),
          notes: val("eventNotes"),
          layoutLink: val("eventLayout"),
          inputList: val("eventInputList"),
          createLayoutFile: document.getElementById("createLayoutFile")?.checked || false,
          createInputListFile: document.getElementById("createInputListFile")?.checked || false,
          isPublished: val("eventPublished") === "true",
          isPrivate: false,
          roles: collectSelectedRoles("#admin-create")
        };

        const data = await serverCall("createEventWithRoles", [payload]);

        state = data;
        render();

        if (state.isAdmin) {
          state.admin = await serverCall("getAdminData");
          renderAdmin();
        }

        showToast("Event created", `${payload.title} has been added.`, "success", 3500);
      } catch (error) {
        showToast("Could not create event", error.message || error, "error", 4500);
      } finally {
        setBusy(false);
      }
