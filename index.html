          <div class="list-table" style="margin-bottom:12px;">
            ${staffing.length ? staffing.map(item => `
              <div class="staffing-event-card ${String(item.event.EventID) === String(staffingEventId) ? "active" : ""}" onclick="openStaffingEvent('${escapeAttr(item.event.EventID)}')">
                <div>
                  <strong>${escapeHtml(item.event.Title)}</strong>
                  <div style="color:var(--muted); font-size:12px; margin-top:2px;">
                    ${escapeHtml(item.event.Tag)} · ${escapeHtml(shortDate(item.event.Date))} · ${escapeHtml(item.event.StartTime)}–${escapeHtml(item.event.EndTime)}
                  </div>
                </div>
                <div class="toolbar" style="justify-content:flex-end;">
                  ${(() => {
                    const missing = staffingMissingPeopleLabel(item);

                    return `
                      <span class="pill ${missing.className}">
                        ${escapeHtml(missing.text)}
                      </span>
                    `;
                  })()}
                  <span class="pill blue">Details</span>
                </div>
              </div>
            `).join("") : `<div class="empty">No events found.</div>`}
          </div>

          <div id="staffingDetails">${selected ? renderStaffingDetails(selected) : ""}</div>
        </div>
      `;
    }

    function getStaffingRolesFlat(item) {
      if (Array.isArray(item.rolesFlat)) {
        return item.rolesFlat;
      }

      if (Array.isArray(item.roles)) {
        return item.roles.flatMap(section => Array.isArray(section.roles) ? section.roles : []);
      }

      return [];
    }

    function staffingMissingPeople(item) {
      return getStaffingRolesFlat(item).reduce((total, role) => {
        const min = Number(role.MinPeople || 0);
        const filled = Number(role.Filled || 0);
        return total + Math.max(min - filled, 0);
      }, 0);
    }

    function staffingMissingPeopleLabel(item) {
      const missingPeople = staffingMissingPeople(item);

      if (missingPeople <= 0) {
        return {
          className: "green",
          text: "Covered"
        };
      }

      return {
        className: "amber",
        text: `${missingPeople} ${missingPeople === 1 ? "person" : "people"} missing`
      };
    }

    function staffingPeopleNotSignedUp(item) {
      const signedEmails = new Set(
        getStaffingRolesFlat(item)
          .flatMap(role => Array.isArray(role.Signups) ? role.Signups : [])
          .map(signup => String(signup.Email || "").trim().toLowerCase())
          .filter(Boolean)
      );

      const unavailableEmails = new Set(
        (item.availability || [])
          .filter(row => row.Status === "Performing" || row.Status === "Unavailable")
          .map(row => String(row.Email || "").trim().toLowerCase())
          .filter(Boolean)
      );

      return (state.admin?.users || [])
        .filter(user => normaliseYearGroupDisplay(user.YearGroup) !== "Archived")
        .filter(user => String(user.Email || "").trim())
        .filter(user => !signedEmails.has(String(user.Email || "").trim().toLowerCase()))
        .filter(user => !unavailableEmails.has(String(user.Email || "").trim().toLowerCase()))
        .sort((a, b) => {
          const yearCompare = normaliseYearGroupDisplay(a.YearGroup).localeCompare(normaliseYearGroupDisplay(b.YearGroup));
          if (yearCompare !== 0) return yearCompare;
          return String(a.Name || a.Email).localeCompare(String(b.Name || b.Email));
        });
    }

    function renderPeopleNotSignedUp(item) {
      const people = staffingPeopleNotSignedUp(item);

      if (!people.length) {
        return `
          <div class="notice success" style="text-align:left; margin-bottom:12px;">
            <strong>No unassigned people</strong>
            <div style="margin-top:6px;">Everyone is either signed up, performing, or unavailable for this event.</div>
          </div>
        `;
      }

      return `
        <div class="notice" style="text-align:left; margin-bottom:12px;">
          <strong>People not signed up yet</strong>
          <div style="margin-top:6px; color:var(--muted);">
            ${people.length} active ${people.length === 1 ? "user has" : "users have"} not signed up to this event.
          </div>

          <div class="not-signed-grid">
            ${people.map(user => {
              const displayName = user.Name || user.Email;
              const yearGroup = normaliseYearGroupDisplay(user.YearGroup);
              const email = String(user.Email || "").trim();

              return `
                <div class="not-signed-row">
                  <div class="availability-person">
                    <strong>${escapeHtml(displayName)}</strong>
                    ${yearGroup ? `<span class="pill">${escapeHtml(yearGroup)}</span>` : ""}
                  </div>

                  <div class="availability-admin-actions">
                    <button
                      class="btn small performing"
                      onclick="adminSetAvailability('${escapeAttr(item.event.EventID)}', '${escapeAttr(email)}', 'Performing', '${escapeAttr(displayName)}')"
                    >
                      Performing
                    </button>

                    <button
                      class="btn small unavailable"
                      onclick="adminSetAvailability('${escapeAttr(item.event.EventID)}', '${escapeAttr(email)}', 'Unavailable', '${escapeAttr(displayName)}')"
                    >
                      Unavailable
                    </button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function renderEventAvailabilityList(item) {
      const availability = Array.isArray(item.availability)
        ? item.availability.filter(row => row.Status === "Performing" || row.Status === "Unavailable")
        : [];

      if (!availability.length) {
        return "";
      }

      return `
        <div class="notice" style="text-align:left; margin-bottom:12px;">
          <strong>Cannot attend / performing</strong>
          <div style="margin-top:6px; color:var(--muted);">
            These people are removed from the “not signed up yet” list.
          </div>

          <div class="availability-list">
            ${availability.map(row => {
              const displayName = row.Name || row.Email;
              const yearGroup = normaliseYearGroupDisplay(row.YearGroup);
              const statusClass = row.Status === "Performing" ? "blue" : "amber";
              const statusText = row.Status === "Performing" ? "Performing" : "Unavailable";

              return `
                <div class="availability-row">
                  <div class="availability-person">
                    <strong>${escapeHtml(displayName)}</strong>
                    ${yearGroup ? `<span class="pill">${escapeHtml(yearGroup)}</span>` : ""}
                    <span class="pill ${statusClass}">${escapeHtml(statusText)}</span>
                  </div>

                  <div class="availability-actions">
                    <button
                      class="btn small undo"
                      onclick="adminClearAvailability('${escapeAttr(item.event.EventID)}', '${escapeAttr(row.Email)}', '${escapeAttr(displayName)}')"
                    >
                      Remove marker
                    </button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function openStaffingEvent(eventId) {
      staffingEventId = eventId;
      renderAdminStaffing();
    }

    function renderStaffingDetails(item) {
      const missing = getStaffingRolesFlat(item).filter(role => {
        return Number(role.Filled || 0) < Number(role.MinPeople || 0);
      });

      const missingLabel = staffingMissingPeopleLabel(item);

      return `
        <div class="panel pad">
          <div class="toolbar" style="justify-content:space-between; margin-bottom:12px;">
            <div>
              <h2 style="margin:0;">${escapeHtml(item.event.Title)}</h2>
              <p style="margin:6px 0 0; color:var(--muted);">${escapeHtml(item.event.Tag)} · ${escapeHtml(item.event.Date)} · ${escapeHtml(item.event.StartTime)}–${escapeHtml(item.event.EndTime)}</p>
            </div>
            <span class="pill ${missingLabel.className}">${escapeHtml(missingLabel.text)}</span>
          </div>

          ${missing.length ? `
            <div class="notice" style="text-align:left; margin-bottom:12px;">
              <strong>Missing people</strong>
              <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
                ${missing.map(role => {
                  const missingForRole = Math.max(Number(role.MinPeople || 0) - Number(role.Filled || 0), 0);

                  return `
                    <span class="pill amber">
                      ${escapeHtml(role.RoleName)} · ${missingForRole} ${missingForRole === 1 ? "person" : "people"} needed
                    </span>
                  `;
                }).join("")}
              </div>
            </div>
          ` : `
            <div class="notice success" style="text-align:left; margin-bottom:12px;">
              <strong>Minimum covered</strong>
              <div style="margin-top:6px;">All required minimums are covered for this event.</div>
            </div>
          `}

          ${renderPeopleNotSignedUp(item)}
          ${renderEventAvailabilityList(item)}

          <div class="role-sections">
            ${item.roles.map(section => {
              const roleCount = section.roles.length;
              const hasUnlimited = section.roles.some(role => role.IsUnlimited);
              const peopleCount = section.roles.reduce((total, role) => {
                if (role.IsUnlimited) return total;
                return total + Number(role.MaxPeople || 0);
              }, 0);
              const peopleLabel = hasUnlimited
                ? peopleCount > 0
                  ? `${peopleCount}+ ${peopleCount === 1 ? "person" : "people"} max`
                  : "Unlimited max"
                : `${peopleCount} ${peopleCount === 1 ? "person" : "people"} max`;

              return `
                <section class="dept-section">
                  <div class="dept-head">
                    <h3>${escapeHtml(section.name)}</h3>
                    <div class="toolbar">
                      <span class="pill">${roleCount} ${roleCount === 1 ? "role" : "roles"}</span>
                      <span class="pill">${escapeHtml(peopleLabel)}</span>
                    </div>
                  </div>

                  <div class="roles-grid">
                    ${section.roles.map(role => renderStaffingRole(role)).join("")}
                  </div>
                </section>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }


    function renderStaffingRole(role) {
      const missing = role.Filled < role.MinPeople;

      return `
        <div class="staffing-role">
          <div class="role-top">
            <div>
              <h4 style="margin:0;">${escapeHtml(role.RoleName)}</h4>
              <div class="role-sub">${role.IsOptional ? "Optional" : "Required"} · ${role.Filled}/${role.IsUnlimited ? "∞" : role.MaxPeople}</div>
            </div>
            <span class="pill ${missing ? "amber" : "green"}">${missing ? "Missing" : "OK"}</span>
          </div>

          <div class="staffing-signups">
            ${role.Signups.length ? role.Signups.map(signup => `
              <div class="staffing-person">
                <div>
                  <strong style="font-size:13px;">${escapeHtml(signup.Name || signup.Email)}</strong>
                  <div style="color:var(--muted); font-size:12px;">${escapeHtml(signup.YearGroup || "")} · ${escapeHtml(signup.Email)}</div>
                </div>
                <button class="btn danger small" title="Remove signup" onclick="adminRemoveSignup('${escapeAttr(signup.SignupID)}', '${escapeAttr(signup.Name || signup.Email)}')">Remove</button>
              </div>
            `).join("") : `<div class="person-line">No one signed up.</div>`}
          </div>

          <div class="staffing-actions">
            ${role.IsUnlimited || role.SpacesLeft > 0 ? `
              <button
                class="btn small"
                onclick="adminAddSignup('${escapeAttr(role.EventID)}', '${escapeAttr(role.EventRoleID)}', '${escapeAttr(role.RoleName)}')"
              >
                Add person
              </button>
            ` : `
              <button class="btn unavailable small" disabled>Role full</button>
            `}
          </div>
        </div>
      `;
    }

    function adminRemoveSignup(signupId, personName) {
      showReasonToast(
        "Remove signup?",
        `Enter a reason for removing ${personName}.`,
        async reason => {
          let workingToast = null;

          try {
            setBusy(true);
            workingToast = showToast("Removing signup", "One moment...", "info", 0);

            state.admin = await serverCall("removeSignupAsAdmin", [signupId, reason]);

            dismissToast(workingToast);
            renderAdminStaffing();

            showToast("Signup removed", `${personName} has been removed.`, "success", 3200);
          } catch (error) {
            dismissToast(workingToast);
            showToast("Could not remove signup", error.message || error, "error", 4500);
          } finally {
            setBusy(false);
          }
        }
      );
    }


    function adminSetAvailability(eventId, email, status, personName) {
      const label = status === "Performing" ? "performing" : "unavailable";

      showConfirmToast(
        status === "Performing" ? "Mark as performing?" : "Mark as unavailable?",
        `This will remove ${personName || email} from any current role signups for this event.`,
        async () => {
          let workingToast = null;

          try {
            setBusy(true);

            workingToast = showToast("Updating availability", `Marking ${personName || email} as ${label}...`, "info", 0);

            state.admin = await serverCall("adminSetUserAvailability", [eventId, email, status]);

            dismissToast(workingToast);
            renderAdminStaffing();

            showToast("Availability updated", `${personName || email} is now marked as ${label}.`, "success", 3200);
          } catch (error) {
            dismissToast(workingToast);
            showToast("Could not update availability", error.message || error, "error", 5000);
          } finally {
            setBusy(false);
          }
        }
      );
    }

    async function adminClearAvailability(eventId, email, personName) {
      let workingToast = null;

      try {
        setBusy(true);

        workingToast = showToast("Updating availability", `Removing marker for ${personName || email}...`, "info", 0);

        state.admin = await serverCall("adminClearUserAvailability", [eventId, email]);

        dismissToast(workingToast);
        renderAdminStaffing();

        showToast("Availability cleared", `${personName || email} is back in the not signed up list.`, "success", 3000);
      } catch (error) {
        dismissToast(workingToast);
        showToast("Could not clear availability", error.message || error, "error", 5000);
      } finally {
        setBusy(false);
      }
    }

    function adminAddSignup(eventId, eventRoleId, roleName) {
      const users = (state.admin?.users || [])
        .filter(user => normaliseYearGroupDisplay(user.YearGroup) !== "Archived")
        .filter(user => String(user.Email || "").trim())
        .sort((a, b) => String(a.Name || a.Email).localeCompare(String(b.Name || b.Email)));

      if (!users.length) {
        showToast("No users found", "There are no active users to add.", "warning", 3500);
        return;
      }

      showSelectUserToast(
        "Add person to role",
        `Choose who to add to ${roleName}.`,
        users,
        async selectedEmail => {
          let workingToast = null;

          try {
            setBusy(true);

            const selectedUser = users.find(user => String(user.Email) === String(selectedEmail));
            const selectedName = selectedUser ? selectedUser.Name || selectedUser.Email : selectedEmail;

            workingToast = showToast(
              "Adding signup",
              `Adding ${selectedName} to ${roleName}...`,
              "info",
              0
            );

            state.admin = await serverCall("adminSignUpUserForRole", [eventId, eventRoleId, selectedEmail]);

            dismissToast(workingToast);
            renderAdminStaffing();

            showToast(
              "Signup added",
              `${selectedName} has been added to ${roleName}.`,
              "success",
              3500
            );
          } catch (error) {
            dismissToast(workingToast);
            showToast("Could not add signup", error.message || error, "error", 5000);
          } finally {
            setBusy(false);
          }
        }
      );
    }

    function handleAdminUserSearch(value) {
      adminUserSearch = String(value || "").trim().toLowerCase();
      renderAdminUsers();

      const input = document.getElementById("trainingEmail");
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function renderAdminUsers() {
      const users = state.admin?.users || [];
      const query = adminUserSearch;

      const matchesUserSearch = user => {
        if (!query) return true;

        const yearGroup = normaliseYearGroupDisplay(user.YearGroup);
        const tags = Array.isArray(user.TrainingTags)
          ? user.TrainingTags.map(trainingTagName).join(" ")
          : "";

        const haystack = [
          user.Email,
          user.Name,
          yearGroup,
          tags
        ].join(" ").toLowerCase();

        return haystack.includes(query);
      };

      const activeUsers = users
        .filter(u => normaliseYearGroupDisplay(u.YearGroup) !== "Archived")
        .filter(matchesUserSearch);

      const archivedUsers = users
        .filter(u => normaliseYearGroupDisplay(u.YearGroup) === "Archived")
        .filter(matchesUserSearch);

      document.getElementById("admin-users").innerHTML = `
        <div class="panel pad">
          <div class="toolbar" style="justify-content:space-between; margin-bottom:14px;">
            <div>
              <p class="mini-title" style="margin-bottom:4px;">Users and training</p>
              <p style="margin:0; color:var(--muted); font-size:13px;">
                Add training tags, update year groups, and archive leavers.
              </p>
            </div>

            <button class="btn danger small" onclick="confirmRollYearGroups()">Roll year groups forward</button>
          </div>

          <div class="form-grid" style="margin-bottom:12px;">
            <div class="field span-3">
              <label>User email</label>
              <input
                id="trainingEmail"
                placeholder="Search name or email..."
                value="${escapeAttr(adminUserSearch)}"
                oninput="handleAdminUserSearch(this.value)"
              >
            </div>

            <div class="field span-2">
              <label style="display:flex; align-items:center; gap:7px;">
                Training tag
                <button
                  id="trainingTagHelpDot"
                  class="help-dot"
                  type="button"
                  data-help=""
                  aria-label="Show training tag description"
                  onclick="event.preventDefault(); event.stopPropagation(); showInfoToast('Training tag', this.dataset.help || 'No description available.');"
                >?</button>
              </label>
              <select id="trainingTag" onchange="updateTrainingTagHelp()">
                ${TRAINING_TAGS.map(tag => `
                  <option value="${escapeAttr(tag.id)}">${escapeHtml(tag.name)}</option>
                `).join("")}
              </select>
            </div>

            <div class="field">
              <label>&nbsp;</label>
              <button class="btn primary" onclick="submitTrainingTag()">Add tag</button>
            </div>
          </div>

          <p class="mini-title">Active users</p>

          <div class="list-table">
            ${activeUsers.length ? activeUsers.map(u => renderUserAdminRow(u)).join("") : `<div class="empty">No active users yet.</div>`}
          </div>

          <p class="mini-title" style="margin-top:18px;">Archived users</p>

          <div class="list-table">
            ${archivedUsers.length ? archivedUsers.map(u => renderUserAdminRow(u)).join("") : `<div class="empty">No archived users.</div>`}
          </div>
        </div>
      `;

      setTimeout(updateTrainingTagHelp, 0);
    }

    function renderNeededPill(e) {
      const missingPeople = Number(e.MissingPeople ?? e.MissingCount ?? 0);
      const openSpaces = Number(e.OpenSpaces ?? 0);
      const roleCount = Number(e.RoleCount ?? 0);

      const breakdown = buildEventStaffingHelp(e);

      if (roleCount <= 0) {
        return `<span class="pill">No roles</span>`;
      }

      if (missingPeople > 0) {
        const label = `${missingPeople} more ${missingPeople === 1 ? "person" : "people"} required`;

        return `
          <span class="pill amber needed-pill">
            <span>${escapeHtml(label)}</span>
            <button
              class="needed-help"
              type="button"
              data-help="${escapeAttr(breakdown)}"
              aria-label="Show staffing breakdown"
              onclick="event.stopPropagation(); showInfoToast('Staffing breakdown', this.dataset.help || 'No breakdown available');"
            >i</button>
          </span>
        `;
      }

      if (openSpaces > 0 || e.HasUnlimitedOpenSpaces) {
        const label = e.HasUnlimitedOpenSpaces
          ? "Covered, spaces still open"
          : `${openSpaces} ${openSpaces === 1 ? "space" : "spaces"} still open`;

        return `
          <span class="pill blue needed-pill">
            <span>${escapeHtml(label)}</span>
            <button
              class="needed-help"
              type="button"
              data-help="${escapeAttr(breakdown)}"
              aria-label="Show staffing breakdown"
              onclick="event.stopPropagation(); showInfoToast('Staffing breakdown', this.dataset.help || 'No breakdown available');"
            >i</button>
          </span>
        `;
      }

      return `
        <span class="pill green needed-pill">
          <span>Full</span>
          <button
            class="needed-help"
            type="button"
            data-help="${escapeAttr(breakdown)}"
            aria-label="Show staffing breakdown"
            onclick="event.stopPropagation(); showInfoToast('Staffing breakdown', this.dataset.help || 'No breakdown available');"
          >i</button>
        </span>
      `;
    }

    function formatDepartmentBreakdown(items, valueKey, emptyText) {
      if (!Array.isArray(items) || !items.length) {
        return emptyText;
      }

      return items
        .filter(item => {
          const value = item[valueKey];
          return String(value || "").toLowerCase() === "unlimited" || Number(value || 0) > 0;
        })
        .map(item => {
          const value = item[valueKey];
          const displayValue = String(value || "").toLowerCase() === "unlimited" ? "unlimited" : value;
          return `${item.Department}: ${displayValue}`;
        })
        .join(" | ") || emptyText;
    }

    function buildEventStaffingHelp(e) {
      const requiredDepartments = Array.isArray(e.DepartmentNeeds) ? e.DepartmentNeeds : [];
      const openDepartments = Array.isArray(e.DepartmentOpenSpaces) ? e.DepartmentOpenSpaces : [];

      const requiredLine = formatDepartmentBreakdown(
        requiredDepartments,
        "MissingPeople",
        "None"
      );

      const openLine = formatDepartmentBreakdown(
        openDepartments,
        "OpenSpaces",
        "None"
      );

      return `Required still needed:\n${requiredLine}\n\nSpaces still open:\n${openLine}`;
    }

    function renderUserAdminRow(u) {
      const yearGroup = normaliseYearGroupDisplay(u.YearGroup);
      const tagText = u.TrainingTags.length
        ? u.TrainingTags.map(trainingTagName).join(", ")
        : "No training tags";

      return `
        <div class="table-row" style="grid-template-columns:minmax(0, 1fr) 190px auto auto;">
          <div style="min-width:0;">
            <strong>${escapeHtml(u.Name || u.Email)}</strong>
            <span>${escapeHtml(yearGroup || "No year")} · ${escapeHtml(u.Email)} · ${escapeHtml(tagText)}</span>
          </div>

          <select onchange="submitUserYearGroup('${escapeAttr(u.Email)}', this.value)">
            ${yearGroupOptions(yearGroup)}
          </select>

          <span class="pill ${u.IsAdmin ? "blue" : yearGroup === "Archived" ? "amber" : ""}">
            ${u.IsAdmin ? "Admin" : yearGroup === "Archived" ? "Archived" : "Crew"}
          </span>

          <button class="btn small" onclick="selectTrainingUser('${escapeAttr(u.Email)}', '${escapeAttr(u.Name || u.Email)}')">Select user</button>
        </div>
      `;
    }

    async function submitUserYearGroup(email, yearGroup) {
      let workingToast = null;

      try {
        setBusy(true);

        workingToast = showToast(
          "Updating year group",
          `Changing ${email} to ${yearGroup}...`,
          "info",
          0
        );

        state.admin = await serverCall("updateUserYearGroup", [email, yearGroup]);

        renderAdminUsers();
        dismissToast(workingToast);

        showToast("Year group updated", `${email} is now ${yearGroup}.`, "success", 3000);
      } catch (error) {
        dismissToast(workingToast);
        showToast("Could not update year group", error.message || error, "error", 4500);
      } finally {
        setBusy(false);
      }
    }

    function confirmRollYearGroups() {
      showConfirmToast(
        "Roll year groups forward?",
        "This will move Year 7-12 up by one year and archive Year 13. N/A and Archived users stay the same.",
        rollYearGroupsForward
      );
    }

    async function rollYearGroupsForward() {
      let workingToast = null;

      try {
        setBusy(true);

        workingToast = showToast(
          "Rolling year groups forward",
          "Updating user year groups...",
          "info",
          0
        );

        const result = await serverCall("rollYearGroupsForward");

        state.admin = result.admin;

        renderAdminUsers();
        dismissToast(workingToast);

        showToast(
          "Year groups rolled forward",
          `${result.changed} user(s) updated. ${result.archived} user(s) archived.`,
          "success",
          4500
        );
      } catch (error) {
        dismissToast(workingToast);
        showToast("Could not roll year groups", error.message || error, "error", 4500);
      } finally {
        setBusy(false);
      }
    }

    function selectTrainingUser(email, name) {
      adminUserSearch = email;

      const input = document.getElementById("trainingEmail");

      if (input) {
        input.value = email;
      }

      renderAdminUsers();

      showToast("User selected", `${name} is ready to update. Choose a training tag and press Add.`, "info", 3000);
    }

    function updateTrainingTagHelp() {
      const dot = document.getElementById("trainingTagHelpDot");
      const selected = val("trainingTag");

      if (!dot) return;

      dot.dataset.help = trainingTagDescription(selected) || "No description available.";
      dot.setAttribute("aria-label", `Show training tag description: ${dot.dataset.help}`);
    }

    async function submitTrainingTag() {
      let workingToast = null;

      try {
        const email = val("trainingEmail");
        const tag = val("trainingTag");

        if (!email.trim()) {
          showToast("Choose a user", "Select a user before adding a training tag.", "warning", 3500);
          return;
        }

        setBusy(true);

        workingToast = showToast(
          "Adding tag",
          `Adding ${trainingTagName(tag)} to ${email}...`,
          "info",
          0
        );

        const adminData = await serverCall("addTrainingTag", [email, tag]);

        state.admin = adminData;
        renderAdminUsers();

        dismissToast(workingToast);

        showToast(
          "Tag added",
          `${trainingTagName(tag)} has been added to ${email}.`,
          "success",
          3500
        );
      } catch (error) {
        dismissToast(workingToast);
        showToast("Could not add training tag", error.message || error, "error", 4500);
      } finally {
        setBusy(false);
      }
    }

    function renderAdminActivity() {
      const activity = state.admin?.activity || [];

      document.getElementById("admin-activity").innerHTML = `
        <div class="panel pad">
          <p class="mini-title">Recent activity</p>

          <div class="list-table">
            ${activity.length ? activity.map(a => `
              <div class="table-row" style="grid-template-columns:1fr auto;">
                <div>
                  <strong>${escapeHtml(a.Action)}</strong>
                  <span>${escapeHtml(a.Details)} · ${escapeHtml(a.Email)}</span>
                </div>

                <span class="pill">${escapeHtml(a.Timestamp)}</span>
              </div>
            `).join("") : `<div class="empty">No activity yet.</div>`}
          </div>
        </div>
      `;
    }

    function showToast(title, message = "", type = "info", timeout = 3200) {
      const stack = document.getElementById("toastStack");
      if (!stack) return null;

      const toast = document.createElement("div");
      toast.className = `toast ${type}`;

      toast.innerHTML = `
        <div class="toast-title">${escapeHtml(title)}</div>
        ${message ? `<div class="toast-message">${escapeHtml(message)}</div>` : ""}
      `;

      stack.appendChild(toast);

      if (timeout) {
        setTimeout(() => {
          dismissToast(toast);
        }, timeout);
      }

      return toast;
    }


    function showInfoToast(title, message = "") {
      showToast(title, message, "info", 5200);
    }

    function dismissToast(toast) {
      if (!toast) return;

      toast.style.opacity = "0";
      toast.style.transform = "translateY(8px) scale(.98)";
      toast.style.transition = ".16s ease";

      setTimeout(() => toast.remove(), 180);
    }

    function showConfirmToast(title, message, onConfirm) {
      const stack = document.getElementById("toastStack");
      if (!stack) return;

      const toast = document.createElement("div");
      toast.className = "toast warning";

      toast.innerHTML = `
        <div class="toast-title">${escapeHtml(title)}</div>
        <div class="toast-message">${escapeHtml(message)}</div>
        <div class="toast-actions">
          <button class="btn ghost small" type="button">Cancel</button>
          <button class="btn danger small" type="button">Confirm</button>
        </div>
      `;

      const [cancelButton, confirmButton] = toast.querySelectorAll("button");

      cancelButton.addEventListener("click", () => {
        toast.remove();
      });

      confirmButton.addEventListener("click", async () => {
        toast.remove();
        await onConfirm();
      });

      stack.appendChild(toast);
    }

    function showSelectUserToast(title, message, users, onConfirm) {
      const stack = document.getElementById("toastStack");
      if (!stack) return;

      const toast = document.createElement("div");
      toast.className = "toast info";

      toast.innerHTML = `
        <div class="toast-title">${escapeHtml(title)}</div>
        <div class="toast-message">${escapeHtml(message)}</div>

        <div style="margin-top:10px;">
          <select style="width:100%;">
            <option value="">Choose a user...</option>
            ${users.map(user => `
              <option value="${escapeAttr(user.Email)}">
                ${escapeHtml(user.Name || user.Email)}${user.YearGroup ? " · " + escapeHtml(normaliseYearGroupDisplay(user.YearGroup)) : ""}
              </option>
            `).join("")}
          </select>
        </div>

        <div class="toast-actions">
          <button class="btn ghost small" type="button">Cancel</button>
          <button class="btn primary small" type="button">Add</button>
        </div>
      `;

      const select = toast.querySelector("select");
      const [cancelButton, confirmButton] = toast.querySelectorAll("button");

      cancelButton.addEventListener("click", () => {
        toast.remove();
      });

      confirmButton.addEventListener("click", async () => {
        const selectedEmail = select.value;

        if (!selectedEmail) {
          select.focus();
          return;
        }

        toast.remove();
        await onConfirm(selectedEmail);
      });

      stack.appendChild(toast);
      select.focus();
    }

    function showReasonToast(title, message, onConfirm) {
      const stack = document.getElementById("toastStack");
      if (!stack) return;

      const toast = document.createElement("div");
      toast.className = "toast warning";

      toast.innerHTML = `
        <div class="toast-title">${escapeHtml(title)}</div>
        <div class="toast-message">${escapeHtml(message)}</div>
        <div style="margin-top:10px;">
          <input type="text" placeholder="Type here..." style="width:100%;">
        </div>
        <div class="toast-actions">
          <button class="btn ghost small" type="button">Cancel</button>
          <button class="btn danger small" type="button">Remove</button>
        </div>
      `;

      const input = toast.querySelector("input");
      const [cancelButton, confirmButton] = toast.querySelectorAll("button");

      cancelButton.addEventListener("click", () => {
        toast.remove();
      });

      confirmButton.addEventListener("click", async () => {
        const reason = input.value.trim();

        if (!reason) {
          input.focus();
          return;
        }

        toast.remove();
        await onConfirm(reason);
      });

      stack.appendChild(toast);
      input.focus();
    }

    function groupBy(list, key) {
      return list.reduce((acc, item) => {
        const value = item[key] || "Other";
        acc[value] = acc[value] || [];
        acc[value].push(item);
        return acc;
      }, {});
    }

    function val(id) {
      return document.getElementById(id)?.value || "";
    }

    function shortDate(value) {
      return String(value || "").replace(/\s\d{4}$/, "");
    }

    function setBusy(isBusy) {
      document.querySelectorAll("button").forEach(btn => btn.disabled = isBusy);
    }

    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(value);
      return String(value).replace(/"/g, '\\"');
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatMultiline(value) {
      return escapeHtml(value).replace(/\r?\n/g, "<br>");
    }

    function escapeTextarea(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    window.addEventListener("resize", queueDashboardPanelRender);

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", queueDashboardPanelRender);
    }

    applyResponsiveMode();
    loadApp();
  </script>
</body>
</html>
